<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0e13"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style><script>window.DRAGONS_SITE = true;</script></head><body><title>Dragon World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Écran de jeu plein écran : la 3D derrière, l'interface par-dessus. Un seul thème sombre, voulu. */
:root {
  color-scheme: dark;
  --nuit: #0d0e13;
  --panneau: rgba(17, 18, 26, 0.86);
  --panneau-plein: #15161f;
  --trait: rgba(236, 230, 218, 0.1);
  --trait-fort: rgba(236, 230, 218, 0.22);
  --texte: #ece6da;
  --doux: #a7a196;
  --ambre: #f2b544;
  --ambre-sombre: #7a5410;
  --feu: #ff6a3d;
  --glace: #7fd6ff;
  --eau: #2fd0c0;
  --bon: #6fd68a;
  --mal: #ff5d5d;
  --titre: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --corps: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --bord-g: max(16px, env(safe-area-inset-left, 0px));
  --bord-d: max(16px, env(safe-area-inset-right, 0px));
  --haut: env(safe-area-inset-top, 0px);
  --hud: calc(env(safe-area-inset-top, 0px) + 50px); /* bas de la barre du haut, mis à jour par le jeu */
  --bas: env(safe-area-inset-bottom, 0px);
}
html, body { height: 100%; }
body { background: var(--nuit); color: var(--texte); font-family: var(--corps); font-size: 14px; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#scene3d { position: fixed; inset: 0; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ambre); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--titre); margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.doux { color: var(--doux); }
.feu { --el: var(--feu); } .glace { --el: var(--glace); } .eau { --el: var(--eau); }

/* ---------- Barre du haut ---------- */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: calc(var(--haut) + 8px) var(--bord-d) 8px var(--bord-g); display: flex; gap: 8px; align-items: center; pointer-events: none; }
#hud > * { pointer-events: auto; }
.logo { font-family: var(--titre); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ambre); white-space: nowrap; margin-right: 4px; }
.logo small { display: block; font-size: 9px; letter-spacing: 0.18em; color: var(--doux); font-weight: 500; }
.ressources { display: flex; gap: 6px; flex-wrap: wrap; min-width: 0; flex: 1; justify-content: flex-end; }
.ressources::-webkit-scrollbar { display: none; }
.puce { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 4px 6px; border-radius: 999px; background: var(--panneau); border: 1px solid var(--trait); font-family: var(--mono); font-size: 12px; white-space: nowrap; backdrop-filter: blur(8px); }
.puce svg { width: 16px; height: 16px; flex: none; }
.puce.energie { border-color: rgba(242, 181, 68, 0.4); }
.puce.gemmes { border-color: rgba(190, 120, 255, .55); color: #e8d0ff; }
.puce[role=button] { cursor: pointer; } .puce[role=button]:active { transform: scale(.95); }
.info-res { display: grid; gap: 12px; } .info-res p { margin: 4px 0 0; font-size: 14px; line-height: 1.5; }
.info-res-tete { display: flex; align-items: center; gap: 10px; } .info-res-tete svg { width: 34px; height: 34px; } .info-res-tete b { font-size: 26px; }
.puce .jauge { width: 38px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
.puce .jauge i { display: block; height: 100%; background: var(--ambre); }
/* Sur les îles : les ressources en colonne à gauche, sous le conseil de Maëlis */
body.ecran-iles:not(.hud-ligne) #hud { right: auto; bottom: auto; top: calc(var(--hud) + var(--tuto, 0px) + 4px); padding: 0 0 0 var(--bord-g); flex-direction: column; align-items: flex-start; z-index: 14; max-height: calc(100vh - var(--hud) - var(--tuto, 0px) - var(--bas) - 100px); overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
body.ecran-iles:not(.hud-ligne) #hud::-webkit-scrollbar { display: none; }
body.ecran-iles:not(.hud-ligne) .logo { display: none; }
body.ecran-iles:not(.hud-ligne) .ressources { display: flex !important; flex-direction: column; align-items: flex-start; gap: 4px; flex: none; }
body.ecran-iles:not(.hud-ligne) .puce { padding: 3px 8px 3px 5px; font-size: 11px; }
body.ecran-iles:not(.hud-ligne) .puce .jauge { width: 26px; }

/* ---------- Barre du bas ---------- */
#nav { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bas) + 10px); z-index: 20; display: flex; gap: 4px; padding: 5px; background: var(--panneau); border: 1px solid var(--trait); border-radius: 16px; backdrop-filter: blur(10px); max-width: calc(100% - 24px); }
#nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 58px; padding: 6px 8px; border-radius: 11px; color: var(--doux); text-decoration: none; font-size: 11px; font-weight: 600; position: relative; }
#nav a svg { width: 22px; height: 22px; }
#nav a.actif { background: rgba(242, 181, 68, 0.14); color: var(--ambre); }
#nav a:hover { color: var(--texte); }
#nav .pastille { position: absolute; top: 2px; right: 8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--mal); color: #fff; font-size: 10px; line-height: 16px; text-align: center; font-family: var(--mono); }
@media (max-width: 700px) {
  .logo { display: none; }
  #hud { padding-top: calc(var(--haut) + 6px); padding-bottom: 4px; }
  .ressources { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; justify-content: stretch; }
  .ressources .puce { padding: 3px 5px; gap: 3px; font-size: 11px; justify-content: center; min-width: 0; }
  .ressources .puce svg { width: 13px; height: 13px; }
  .ressources .puce.energie { grid-column: span 2; }
  .ressources .puce .jauge { width: 26px; }
}
@media (max-width: 560px) { #nav a { min-width: 0; flex: 1; padding: 6px 2px; font-size: 10px; } #nav { left: var(--bord-g); right: var(--bord-d); transform: none; max-width: none; justify-content: space-between; } }

/* ---------- Panneaux ---------- */
#ecran { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
#ecran > * { pointer-events: auto; }
.panneau { background: var(--panneau); border: 1px solid var(--trait); border-radius: 16px; backdrop-filter: blur(12px); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--trait-fort); background: rgba(255,255,255,0.06); font-weight: 600; font-size: 13px; transition: background .15s, transform .1s; }
.btn:hover { background: rgba(255,255,255,0.12); }
.btn:active { transform: translateY(1px); }
.btn.principal { background: var(--ambre); color: #1c1305; border-color: transparent; }
.btn.principal:hover { background: #ffc85c; }
.btn.danger { border-color: rgba(255, 93, 93, 0.5); color: #ffb0b0; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.petit { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
.btn svg { width: 16px; height: 16px; }
.etiquette { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--doux); font-weight: 600; }
.pil { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: color-mix(in srgb, var(--el, var(--ambre)) 18%, transparent); color: var(--el, var(--ambre)); border: 1px solid color-mix(in srgb, var(--el, var(--ambre)) 40%, transparent); white-space: nowrap; }
.barre { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.09); overflow: hidden; }
.barre i { display: block; height: 100%; border-radius: 4px; background: var(--bon); transition: width .4s; }
.barre.pv i { background: linear-gradient(90deg, #4fc46f, #8be08f); }
.barre.pv.moyen i { background: linear-gradient(90deg, #d8a53a, #f2c85c); }
.barre.pv.bas i { background: linear-gradient(90deg, #d84a3a, #ff7a5c); }
.barre.xp i { background: linear-gradient(90deg, #6a7aff, #9ab0ff); }
.recette { display: flex; flex-wrap: wrap; gap: 6px; }
.recette .puce { background: rgba(255,255,255,0.04); }
.recette .manque { border-color: rgba(255, 93, 93, 0.6); color: #ffb0b0; }

/* ---------- Toasts et fenêtres ---------- */
#toasts { position: fixed; z-index: 60; bottom: calc(var(--bas) + 84px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(92vw, 420px); }
#toasts.haut { bottom: auto; top: calc(var(--haut) + 10px); }
.toast { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 7px 14px 7px 8px; border-radius: 999px; background: rgba(16,15,24,.92); border: 1px solid var(--trait-fort); font-size: 12.5px; line-height: 1.35; animation: toast-monte .28s cubic-bezier(.2,.9,.3,1.2); box-shadow: 0 6px 18px rgba(0,0,0,.45); backdrop-filter: blur(8px); }
.toast i { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; background: rgba(242,181,68,.18); color: var(--ambre); }
.toast.bon { border-color: rgba(111, 214, 138, .45); } .toast.bon i { background: rgba(111,214,138,.2); color: #8ee6a6; }
.toast.mal { border-color: rgba(255, 93, 93, .5); } .toast.mal i { background: rgba(255,93,93,.2); color: #ff9a9a; }
@keyframes toast-monte { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
/* Gains et pertes de ressources : un chiffre qui jaillit à côté de la ressource */
.gain { position: fixed; z-index: 61; pointer-events: none; transform: translateY(-50%); font: 800 20px var(--titre); letter-spacing: .02em; color: #ffd27a; text-shadow: 0 2px 0 #7a3a10, 0 0 14px rgba(255,180,80,.75); white-space: nowrap; animation: gain 1.9s ease-out forwards; }
.gain.perte { color: #ff9a8a; text-shadow: 0 2px 0 #6a1010, 0 0 12px rgba(255,90,90,.6); }
.gain.dessous { transform: translate(-50%, 0); font-size: 15px; }
@keyframes gain { 0% { opacity: 0; scale: .5; } 12% { opacity: 1; scale: 1.25; } 24% { scale: 1; } 72% { opacity: 1; translate: 0 0; } 100% { opacity: 0; translate: 0 -18px; } }
@keyframes entre { from { opacity: 0; transform: translateY(-6px); } }
#modale { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(5,5,8,.55); padding: 16px var(--bord-d) 16px var(--bord-g); }
#modale .boite { width: min(520px, 100%); max-height: 86vh; overflow: auto; padding: 20px; background: var(--panneau-plein); border: 1px solid var(--trait-fort); border-radius: 18px; animation: entre .2s; }
#modale h2 { font-size: 20px; margin-bottom: 8px; }
#modale .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

/* ---------- Titre ---------- */
.ecran-titre { position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 0 var(--bord-d) calc(var(--bas) + 12vh) var(--bord-g); background: linear-gradient(180deg, rgba(13,14,19,0) 30%, rgba(13,14,19,.85)); text-align: center; gap: 14px; }
.ecran-titre h1 { font-size: clamp(40px, 9vw, 92px); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; line-height: .9; color: var(--texte); text-shadow: 0 4px 40px rgba(255, 140, 60, .35); }
.ecran-titre h1 span { color: var(--ambre); }
.ecran-titre h1 { text-shadow: 0 4px 40px rgba(80, 160, 255, .35); }
.ecran-titre p { max-width: 46ch; color: var(--doux); margin: 0; }
.ecran-titre .note { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }

/* ---------- Portail d'entrée ---------- */
.portail { position: fixed; inset: 0; z-index: 90; pointer-events: none; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle, rgba(20,10,40,0) 0, rgba(8,5,18,.85) 60%); animation: portail-fond 2.3s ease-in forwards; }
.portail > * { grid-area: 1 / 1; }
.portail .anneau { width: 50vmin; height: 50vmin; border-radius: 50%; background: conic-gradient(from 0deg, #7a3aff, #ff8a4a, #2fd0c0, #7fd6ff, #c89aff, #7a3aff); -webkit-mask: radial-gradient(circle, transparent 46%, #000 48%, #000 56%, transparent 58%); mask: radial-gradient(circle, transparent 46%, #000 48%, #000 56%, transparent 58%); filter: blur(1px) drop-shadow(0 0 18px #b48aff); animation: portail-tourne .7s linear infinite, portail-avance 2.3s cubic-bezier(.6,0,.9,.4) forwards; }
.portail .a2 { width: 34vmin; height: 34vmin; animation-duration: .5s, 2.3s; animation-direction: reverse, normal; opacity: .8; }
.portail .a3 { width: 72vmin; height: 72vmin; animation-duration: 1.1s, 2.3s; opacity: .55; }
.portail .coeur { width: 22vmin; height: 22vmin; border-radius: 50%; background: radial-gradient(circle, #fff 0, #ffd6a0 20%, #b05aff 55%, transparent 72%); animation: portail-avance 2.3s cubic-bezier(.6,0,.9,.4) forwards; }
.portail i { width: 4px; height: 4px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px #c89aff; transform: rotate(var(--a)) translateX(var(--r)); animation: portail-etincelle 1.2s var(--d) ease-in infinite; }
.portail .eclair { width: 100%; height: 100%; background: #fff; opacity: 0; animation: portail-eclair 2.3s ease-out forwards; }
@keyframes portail-tourne { to { rotate: 360deg; } }
@keyframes portail-avance { 0% { scale: .15; opacity: 0; } 20% { opacity: 1; } 55% { scale: 1; } 100% { scale: 9; opacity: 1; } }
@keyframes portail-etincelle { from { transform: rotate(var(--a)) translateX(var(--r)); opacity: 1; } to { transform: rotate(calc(var(--a) + 40deg)) translateX(0); opacity: 0; } }
@keyframes portail-eclair { 0%, 55% { opacity: 0; } 66% { opacity: .95; } 100% { opacity: 0; } }
@keyframes portail-fond { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<style id="styles-ecrans"></style>

<canvas id="scene3d"></canvas>
<div id="ecran"></div>
<header id="hud" hidden></header>
<nav id="nav" hidden></nav>
<div id="toasts" aria-live="polite"></div>
<div id="modale" hidden></div>
<noscript>Ce jeu a besoin de JavaScript.</noscript>

</body></html>
